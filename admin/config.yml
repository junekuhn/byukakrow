backend:
  name: github
  repo: junekuhn/byukakrow
  branch: main

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: pages
    label: Pages
    folder: pages
    create: true

    fields:
      - label: Title
        name: title
        widget: string

      - label: Body
        name: body
        widget: markdown